plugins {
    id 'com.android.application'
}

// Firma di release: legge keystore.properties (NON committato) se presente,
// altrimenti ripiega sulla chiave di debug.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'io.maurizio.hyperdesktop'
    compileSdk 35

    defaultConfig {
        applicationId 'io.maurizio.hyperdesktop'
        minSdk 31
        targetSdk 35
        versionCode 233
        versionName '1.12.3'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Solo con la chiave vera: un APK di release firmato con la chiave di debug non
            // si installerebbe sopra quello pubblicato (vedi il controllo in fondo al file).
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true   // BuildConfig.VERSION_NAME per la diagnostica e le impostazioni
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // API Xposed: solo in compilazione, fornita a runtime da LSPosed.
    compileOnly 'de.robv.android.xposed:api:82'
}

// Una build di release senza la chiave di firma si ferma subito con un messaggio chiaro,
// invece di produrre un APK firmato con la chiave di debug (comportamento fino alla 1.12.1).
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists()
            && graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        throw new GradleException("Build di release senza keystore.properties: crealo (vedi README, Build) " +
                "oppure usa assembleDebug per una build di prova.")
    }
}
